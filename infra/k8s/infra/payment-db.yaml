apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-db-pvc
  namespace: platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-db
  namespace: platform
  labels:
    app: payment-db
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the PVC is ReadWriteOnce and mongod locks its data
  # directory exclusively, so a surge pod trying to start alongside the still-running old one
  # crash-loops fighting over that lock instead of ever becoming ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-db
  template:
    metadata:
      labels:
        app: payment-db
    spec:
      containers:
        - name: payment-db
          image: mongo:8
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef: { name: platform-config, key: PAYMENT_DB_USER }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: PAYMENT_DB_PASSWORD }
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef: { name: platform-config, key: PAYMENT_DB_NAME }
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { memory: "384Mi", cpu: "150m" }
            limits: { memory: "768Mi", cpu: "300m" }
          startupProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 20
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: payment-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  namespace: platform
spec:
  type: NodePort
  selector:
    app: payment-db
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 30717
