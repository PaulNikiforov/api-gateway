apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  SPRING_PROFILES_ACTIVE: "docker"
  LIQUIBASE_ENABLED: "true"

  AUTH_DB_NAME: "authdb"
  AUTH_DB_USER: "authuser"
  USER_DB_NAME: "userdb"
  USER_DB_USER: "useruser"
  ORDER_DB_NAME: "orderdb"
  ORDER_DB_USER: "orderuser"
  PAYMENT_DB_NAME: "paymentdb"
  PAYMENT_DB_USER: "paymentuser"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  AUTH_JWKS_URI: "http://authservice:8081/oauth2/jwks"
  AUTH_SERVICE_URL: "http://authservice:8081"
  USER_SERVICE_URL: "http://userservice:8080"
  ORDER_SERVICE_URL: "http://orderservice:8082"
  PAYMENT_SERVICE_URL: "http://paymentservice:8083"

  EXTERNAL_PAYMENT_API_URL: "https://www.random.org/integers"
