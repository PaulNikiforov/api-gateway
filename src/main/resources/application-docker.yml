server:
  port: 8080

# Fallback URLs are for Docker Compose convenience only. Set AUTH_SERVICE_URL and USER_SERVICE_URL env vars in production.
services:
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8080}
  user-service-url: ${USER_SERVICE_URL:http://user-service:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.auth-service-url}
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: ${services.user-service-url}
              predicates:
                - Path=/api/v1/users/**
