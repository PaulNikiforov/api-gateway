services:
  auth-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.auth-service.url}
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: ${services.user-service.url}
              predicates:
                - Path=/users/**
